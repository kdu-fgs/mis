<style>
:root{--ink:#3B3B58;--sub:#6B6A8A;--navy:#1C3060;--gold:#C8A24C;
--lav:#E6E0F8;--lav2:#CFC6F0;--mint:#D5F0E3;--mint2:#B8E3CF;--peach:#FFE5D4;--peach2:#FFD0B3;--sky:#D6EAF8;--sky2:#B5D8F2;
--rose:#FADADD;--rose2:#F4B8BE;--butter:#FFF6D6;--butter2:#FFEAA7;--grey:#F6F4FB;--grey2:#E4E0EF;--line:#E4E0EF}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,Helvetica,sans-serif;color:var(--ink);background:var(--grey);font-size:15px;line-height:1.45}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:22px 0 8px}h3{font-size:14px;margin:18px 0 6px;color:var(--navy)}
p{margin:6px 0}a{color:var(--navy);font-weight:600}
.sub{color:var(--sub)}.small{font-size:12.5px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.btn{border:1px solid var(--lav2);background:var(--lav);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:600}
.btn:hover{background:var(--lav2)}.btn[disabled]{opacity:.55;cursor:default}
.btn.go{background:var(--navy);border-color:var(--navy);color:#fff}.btn.go:hover{background:#27427f}
.btn.ok{background:var(--mint);border-color:var(--mint2)}.btn.no{background:var(--rose);border-color:var(--rose2)}.btn.wait{background:var(--butter);border-color:var(--butter2)}
.btn.sm{padding:4px 10px;font-size:13px}
input,select{font:inherit;color:var(--ink);border:1px solid var(--grey2);border-radius:8px;padding:8px 10px;background:#fff;max-width:100%}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px}
.t-lav{background:var(--lav)}.t-mint{background:var(--mint)}.t-peach{background:var(--peach)}.t-sky{background:var(--sky)}.t-rose{background:var(--rose)}.t-butter{background:var(--butter)}.t-grey{background:var(--grey2)}
.chip{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.msg{border-radius:10px;padding:10px 14px;margin:10px 0}.msg.err{background:var(--rose);border:1px solid var(--rose2)}.msg.ok{background:var(--mint);border:1px solid var(--mint2)}.msg.wait{background:var(--butter);border:1px solid var(--butter2)}.msg.info{background:var(--sky);border:1px solid var(--sky2)}
.spin{display:inline-block;width:16px;height:16px;border:3px solid var(--lav2);border-top-color:var(--navy);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
/* front door */
.door{max-width:880px;margin:0 auto;padding:28px 16px 40px}
.hero{text-align:center;padding:10px 0 4px}
.hero img{width:132px;height:132px}
.hero h1{font-size:26px;color:var(--navy);margin-top:10px}
.hero .uni{color:var(--sub);margin:0}
.rule{height:2px;background:var(--gold);width:120px;margin:14px auto}
.signin{text-align:center}
.signin .g{display:flex;justify-content:center;min-height:44px;margin:12px 0}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.three div{border-radius:10px;padding:12px}
.three b{display:block;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
/* shell */
header.top{background:#fff;border-bottom:3px solid var(--lav2);display:flex;align-items:center;gap:12px;padding:8px 16px;position:sticky;top:0;z-index:5}
header.top img{width:40px;height:40px}
header.top .ttl{font-weight:700;color:var(--navy);line-height:1.15}
header.top .ttl span{display:block;font-weight:400;font-size:12px;color:var(--sub)}
header.top .who{margin-left:auto;text-align:right;font-size:13px;line-height:1.25}
.wrap{display:flex;gap:18px;max-width:1280px;margin:0 auto;padding:16px}
nav#nav{flex:0 0 190px}
nav#nav a{display:block;text-decoration:none;color:var(--ink);padding:9px 12px;border-radius:9px;margin-bottom:4px;font-weight:600;border:1px solid transparent}
nav#nav a:hover{background:var(--lav)}
nav#nav a.on{background:var(--lav2);border-color:var(--lav2)}
main#main{flex:1;min-width:0}
footer{max-width:1280px;margin:0 auto;padding:6px 16px 28px;color:var(--sub);font-size:12px}
/* cards for home */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.cards .card{margin:0}
.cards h3{margin-top:0}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--grey2)}
.row:last-child{border:0}
.row b{min-width:2.2em;text-align:center;border-radius:8px;padding:0 8px}
.notice{border-left:5px solid var(--sky2);background:#fff;border-radius:8px;padding:8px 12px;margin:8px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.notice b{display:block}
/* records */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.sheetchip{border:1px solid var(--grey2);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none}
.sheetchip.on{outline:2px solid var(--navy)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.tools input[type=search]{min-width:220px}
.tw{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:10px;background:#fff;margin:6px 0}
table{border-collapse:collapse;width:max-content;min-width:100%;font-size:13.5px}
th{position:sticky;top:0;background:var(--lav2);text-align:left;padding:7px 10px;white-space:nowrap;cursor:pointer;border-bottom:1px solid var(--grey2);z-index:1}
th.kC{background:var(--grey2)}th.kA{background:var(--butter2)}
td{padding:6px 10px;border-bottom:1px solid var(--grey2);vertical-align:top;max-width:320px;min-width:72px}
tr:nth-child(even) td{background:#FBFAFE}
.pager{display:flex;gap:10px;align-items:center;margin:8px 0}
.legend span{display:inline-block;border-radius:6px;padding:1px 8px;margin-right:6px;font-size:12px}
/* model view (portal / student) */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{border:1px solid var(--lav2);background:#fff;border-radius:9px;padding:6px 14px;font-weight:600}
.tabs button.on{background:var(--lav2)}
dl.kv{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:0;margin:6px 0;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
dl.kv dt{background:var(--lav);padding:6px 10px;font-weight:600;border-bottom:1px solid #fff}
dl.kv dd{margin:0;padding:6px 10px;border-bottom:1px solid var(--grey2)}
/* approvals */
.person{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:start}
.person .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.person input.note{width:100%;margin-top:6px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
@media (max-width:860px){
 .wrap{flex-direction:column;padding:10px}
 nav#nav{flex:none;display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}
 nav#nav a{white-space:nowrap;margin:0}
 .three{grid-template-columns:1fr}
 dl.kv{grid-template-columns:minmax(104px,38%) 1fr}
 dl.kv dt,dl.kv dd{overflow-wrap:anywhere}
 .person{grid-template-columns:1fr}
 header.top .who .small{display:none}
}
</style>

var VERSION_TXT = 'KDU FGS MIS web page 1.0';

var S = { token: '', me: null, pub: null, R: { sheet: '', q: '', col: '', val: '', sort: '', dir: 'asc', page: 1 }, poll: null };
function $(s, r) { return (r || document).querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function ready() { return !/^PASTE_/.test(CONFIG.API_URL) && !/^PASTE_/.test(CONFIG.CLIENT_ID); }
function store(k, v) { try { if (v === undefined) { return sessionStorage.getItem(k); } if (v === null) { sessionStorage.removeItem(k); } else { sessionStorage.setItem(k, v); } } catch (e) { return null; } return null; }
function tokenExp(t) { try { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp * 1000; } catch (e) { return 0; } }
function mkErr(code, msg) { var e = new Error(msg); e.code = code; return e; }
function first(n) { return String(n || '').split(' ')[0] || 'there'; }
function safeUrl(u) { return /^https:\/\//i.test(String(u || '')) ? u : '#'; }
function chip(text, tone) { return '<span class="chip t-' + (tone || 'grey') + '">' + esc(text) + '</span>'; }
function msg(kind, html) { return '<div class="msg ' + kind + '" role="' + (kind === 'err' ? 'alert' : 'status') + '">' + html + '</div>'; }

/* ---------------------------------------------------------------- talking to the script */
async function api(action, args, open) {
  if (!open && S.token && tokenExp(S.token) < Date.now() + 20000) { signOut('Your sign-in has ended. Please sign in again.'); throw mkErr('expired', 'Your sign-in has ended. Please sign in again.'); }
  var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, 150000), res;
  try {
    res = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', signal: ctl.signal,
      body: JSON.stringify({ action: action, token: open ? '' : S.token, args: args || {} }) });
  } catch (e) { throw mkErr('network', 'The MIS could not be reached. Please check your internet connection and try again.'); }
  finally { clearTimeout(timer); }
  var j;
  try { j = await res.json(); } catch (e2) { throw mkErr('network', 'The MIS gave an unexpected answer. Please try again in a moment.'); }
  if (!j.ok) {
    var err = mkErr(j.code, j.message);
    if (j.code === 'expired' || j.code === 'bad_token') { signOut(j.message); }
    throw err;
  }
  return j.data;
}

/* ---------------------------------------------------------------- sign-in */
function onCredential(resp) { S.token = resp.credential; store('fgs_t', S.token); S.me = null; start(); }
function signOut(message) {
  S.token = ''; S.me = null; store('fgs_t', null);
  try { if (window.google && google.accounts && google.accounts.id) { google.accounts.id.disableAutoSelect(); } } catch (e) { /* ignore */ }
  if (S.poll) { clearInterval(S.poll); S.poll = null; }
  location.hash = '';
  door(message || '');
}
function waitForGoogle(cb, tries) {
  if (window.google && google.accounts && google.accounts.id) { cb(true); return; }
  if (tries > 50) { cb(false); return; }
  setTimeout(function () { waitForGoogle(cb, (tries || 0) + 1); }, 200);
}
function drawGoogleButton() {
  var box = $('#gbtn'); if (!box) { return; }
  waitForGoogle(function (ok) {
    box = $('#gbtn'); if (!box) { return; }
    if (!ok) { box.innerHTML = msg('err', 'Google sign-in could not be loaded. Please check your internet connection and reload the page.'); return; }
    google.accounts.id.initialize({ client_id: CONFIG.CLIENT_ID, callback: onCredential, auto_select: true, cancel_on_tap_outside: false });
    box.innerHTML = '';
    google.accounts.id.renderButton(box, { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', width: 280 });
  }, 0);
}

/* ---------------------------------------------------------------- front door (before sign-in)
   Shows only public information: notices and the form links. No personal data is ever sent here. */
async function door(message) {
  var app = $('#app');
  if (!ready()) { app.innerHTML = '<div class="door">' + hero() + '<div class="card">' + msg('info', '<b>Set-up is not finished.</b><br>The two lines marked SET-UP at the top of this file still need the web app address and the sign-in client ID. See the Web Page Set-up Guide, steps 5 and 6.') + '</div></div>'; return; }
  app.innerHTML = '<div class="door">' + hero() +
    '<div class="card signin">' + (message ? msg('err', esc(message)) : '') + '<h2 style="margin-top:0">Sign in</h2><p class="sub">Use the Google account the Faculty has approved for you.</p><div class="g" id="gbtn"></div>' +
    '<p class="small sub">Never share your Google password. The Faculty will never ask for it.</p></div>' +
    '<div id="pubbox"><p class="sub"><span class="spin"></span>Loading notices...</p></div>' +
    '<div class="card"><h2 style="margin-top:0">How to get access</h2><div class="three">' +
    '<div class="t-lav"><b>1. Registered</b>The Faculty Registry adds you to the records with your Google address.</div>' +
    '<div class="t-sky"><b>2. Request</b>Send the Access registration form (see Forms below) using the same Google address.</div>' +
    '<div class="t-mint"><b>3. Approved</b>The Controller approves your address. Then you can sign in here.</div></div></div>' +
    '<p class="small sub">' + esc(CONFIG.HELP_TEXT) + '</p></div>';
  drawGoogleButton();
  try {
    S.pub = S.pub || await api('public', {}, true);

function modelHtml(sheets, id, o) {
  o = o || {};
  if (!sheets.length) { return '<p class="sub">Nothing to show yet.</p>'; }
  var h = sheets.length < 2 ? '' : '<div class="tabs" role="tablist" data-tabs="' + id + '">' + sheets.map(function (s, i) { return '<button role="tab" class="' + (i ? '' : 'on') + '" data-i="' + i + '">' + esc(s.name) + '</button>'; }).join('') + '</div>';
  if (sheets.length < 2) { h = ''; }
  sheets.forEach(function (s, i) {
    h += '<section data-panel="' + id + '" data-i="' + i + '"' + (i ? ' hidden' : '') + '><h2 style="margin-top:6px">' + esc(o.plain ? String(s.title || s.name).replace(/^My /, '') : (s.title || s.name)) + '</h2>' + (s.note ? '<p class="small sub">' + esc(s.note) + '</p>' : '');
    var skip = false;
    s.items.forEach(function (it) {
      if (it.t === 'section') { skip = !!o.noNotices && it.text === 'Notices'; }
      if (skip) { return; }
      if (it.t === 'section') { h += '<h3>' + esc(it.text) + '</h3>'; }
      else if (it.t === 'kv') { h += '<dl class="kv">' + it.rows.map(function (r) { return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') + '</dl>'; }
      else if (it.t === 'table') {
        h += it.rows.length ? '<div class="tw"><table><thead><tr>' + it.head.map(function (c) { return '<th style="cursor:default">' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
          it.rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>' : '<p class="sub small">Nothing to show.</p>';
      }
    });
    h += '</section>';
  });
  return h;
}
document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('.tabs button'); if (!b) { return; }
  var box = b.parentNode, id = box.getAttribute('data-tabs'), i = b.getAttribute('data-i');
  Array.prototype.forEach.call(box.children, function (x) { x.classList.toggle('on', x === b); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-panel="' + id + '"]'), function (p) { p.hidden = p.getAttribute('data-i') !== i; });
});

      else if (p.type === 'mod') { h += '<input id="' + id + '" list="dl_mod" placeholder="type or pick a module code" autocomplete="off"><datalist id="dl_mod">' + D.lists.mod.map(function (x) { return opt(x.v, x.t); }).join('') + '</datalist>'; }
      else if (p.type === 'date') { h += '<input id="' + id + '" type="date">'; }
      else if (p.type === 'month') { h += '<input id="' + id + '" type="month">'; }
      else if (p.type === 'fy') { h += '<input id="' + id + '" value="' + esc(D.lists.fy) + '">'; }
      else if (p.type === 'cyear') { h += '<input id="' + id + '" placeholder="all years">'; }
      else if (p.type === 'reg') { h += '<input id="' + id + '" placeholder="registration number" autocomplete="off">'; }
      else { h += '<input id="' + id + '" autocomplete="off">'; }
    });
    $('#rparams').innerHTML = h; $('#rmsg').innerHTML = '';
  }
  function recent(list) {
    $('#rrecent').innerHTML = list.length ? list.map(function (r) { return '<div class="row"><span>' + (((r.status === 'OK' || r.status === 'Done') && /^https:/.test(r.url)) ? '<a href="' + esc(safeUrl(r.url)) + '" target="_blank" rel="noopener">' + esc(r.name) + '</a>' : esc(r.name)) + '<br><span class="small sub">' + esc(r.ref) + ' | ' + esc(r.at) + '</span></span>' + chip(r.status, (r.status === 'OK' || r.status === 'Done') ? 'mint' : (r.status === 'Failed' ? 'rose' : 'butter')) + '</div>'; }).join('') : '<p class="sub small">No reports yet.</p>';
  }
  async function refresh() { try { var x = await api('reports'); recent(x.recent); } catch (e) { /* ignore */ } }
  function done(x) {
    if (x.state === 'done') { $('#rmsg').innerHTML = msg('ok', '<b>PDF ready</b> (' + esc(x.ref) + ', ' + esc(x.rows) + ' row' + (x.rows == 1 ? '' : 's') + ').<br><a href="' + esc(safeUrl(x.url)) + '" target="_blank" rel="noopener">Open ' + esc(x.name) + '</a>' + (x.mailed ? '<br>A copy was e-mailed to you.' : '')); refresh(); return; }
    $('#rmsg').innerHTML = msg('wait', '<b>Request received.</b> ' + (x.ahead > 1 ? esc(x.ahead) + ' report(s) are ahead of yours. ' : '') + 'The Controller account makes your PDF within about 5 minutes. This page shows the link, and a copy is e-mailed to you.');
    var id = x.id, n = 0;
    S.poll = setInterval(async function () {
      n++; if (n > 120) { clearInterval(S.poll); S.poll = null; return; }
      try {
        var s = await api('reportStatus', { id: id });
        if (s.state === 'Done') { clearInterval(S.poll); S.poll = null; $('#rmsg').innerHTML = msg('ok', '<b>PDF ready</b> (' + esc(s.ref) + ').<br><a href="' + esc(safeUrl(s.url)) + '" target="_blank" rel="noopener">Open ' + esc(s.name) + '</a>' + (s.note ? '<br>' + esc(s.note) : '')); refresh(); }
        else if (s.state === 'Failed') { clearInterval(S.poll); S.poll = null; $('#rmsg').innerHTML = msg('err', '<b>The report could not be made.</b><br>' + esc(s.note)); }
        else if (s.state === 'Unknown') { clearInterval(S.poll); S.poll = null; }
      } catch (e) { /* keep waiting */ }
    }, 15000);
  }
  $('#rep').onchange = pick;
  $('#rgo').onclick = async function () {
    if (BUSY) { return; }
    var r = D.reports[$('#rep').value]; if (!r) { return; }
    var raw = {}; r.params.forEach(function (p) { var e = $('#p_' + p.k); raw[p.k] = e ? e.value : ''; });
    BUSY = true; $('#rgo').disabled = true; if (S.poll) { clearInterval(S.poll); S.poll = null; }
    $('#rmsg').innerHTML = msg('wait', '<span class="spin"></span>' + (D.user.controller ? 'Making the PDF... this can take up to a minute.' : 'Checking and sending your request...'));
    try { done(await api('reportRequest', { rid: r.id, raw: raw })); }
    catch (e) { $('#rmsg').innerHTML = msg('err', esc(e.message)); }
    BUSY = false; $('#rgo').disabled = false;
  };
  pick(); recent(D.recent);
};

/* ---------------------------------------------------------------- start */
window.addEventListener('load', function () { start(); });
})();
</script>
</body>
</html>
